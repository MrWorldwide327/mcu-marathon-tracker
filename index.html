      --star: #d4af37;
      --done-bg: #10241a;

      --progress-color: #d97706;
      --progress-bg: #241a0a;
      --ok: #1f7a4d;

  :root[data-theme="dark"] {

    --bg: #0b0f1a;
    --card: #141b2d;
    --card-hover: #1a2338;
    --border: #232d45;
    --text: #e8ecf5;
    --text-dim: #8891a8;
    --accent: #e62429;
    --accent-dim: #7a1315;
    --serie-badge: #2f6fb0;
    --gold: #d4af37;
    --star: #d4af37;
    --done-bg: #10241a;
    --done-border: #1f7a4d;
    --progress-color: #d97706;

    color: var(--text);

    max-width: 820px;
    margin: 0 auto;

  .header { text-align: center; margin-bottom: 14px; }

  .status-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 0.8rem; }

  .status-bar.warn { border-color: var(--warn); }

  .status-bar.ok .status-dot { background: var(--ok); }
  .status-bar.warn .status-dot { background: var(--warn); }
  .status-text { color: var(--text-dim); flex: 1; min-width: 180px; }
  .status-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .mini-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; }

  /* Tarjetas "hero": siempre oscuras, con colores propios, para mantener el contraste en ambos temas */
  .countdown { text-align: center; margin: 0 0 24px; padding: 16px 12px; background: linear-gradient(135deg, #7a1315, #1a0d0e); border: 1px solid #e62429; border-radius: 10px; }

  .countdown-units { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  .cd-value { font-size: 1.3rem; font-weight: 700; color: #f0cc58; line-height: 1; }
  .cd-unit-label { font-size: 0.65rem; color: #c6aeae; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
  .countdown-date { font-size: 0.78rem; color: #c6aeae; margin-top: 10px; }

  .progress-wrap { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 10px 0 16px; z-index: 10; }
  .progress-bar-bg { background: var(--border); border-radius: 999px; height: 14px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 999px; transition: width 0.4s ease; width: 0%; }
  .progress-label { text-align: center; font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; }

  .saga-title { margin: 28px 0 10px; font-size: 1.05rem; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 6px; }

  .item { display: flex; align-items: flex-start; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; transition: background 0.15s, border-color 0.15s; }

  .item.done { background: var(--done-bg); border-color: var(--done-border); }
  .item.in-progress { background: var(--progress-bg); border-color: var(--progress-color); }

  .checkbox { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--text-dim); display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all 0.15s; }

  .checkbox svg { width: 14px; height: 14px; display: none; }
  .item.done > .checkbox svg, .item.in-progress > .checkbox svg { display: block; }

  .badge-serie { font-size: 0.68rem; background: var(--serie-badge); color: #fff; padding: 2px 7px; border-radius: 999px; font-weight: 600; letter-spacing: 0.3px; }
  .item-desc { font-size: 0.83rem; color: var(--text-dim); margin-top: 3px; line-height: 1.35; }

  .series-progress { display: flex; align-items: center; gap: 6px; margin-left: auto; }

  .rating-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .rating-row.readonly .star { cursor: default; }

  .star svg { position: absolute; top: 0; left: 0; width: 20px; height: 20px; pointer-events: none; }

  .loading { text-align: center; color: var(--text-dim); padding: 40px 0; }
  .legal-note { font-size: 0.68rem; color: var(--text-dim); text-align: center; margin: 24px 0 0; line-height: 1.45; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .modal-overlay.show { display: flex; }
  .modal-box { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 18px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: var(--gold); }
  .modal-text { font-size: 0.83rem; color: var(--text-dim); margin-bottom: 10px; line-height: 1.4; }
  .modal-textarea { width: 100%; min-height: 100px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 0.78rem; font-family: monospace; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .modal-actions .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ---------- Pestañas ---------- */
  .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text-dim); padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; }
  .tab-btn.active { color: var(--gold); border-color: var(--gold); background: var(--progress-bg); }

  .network-wrap { background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .network-intro { font-size: 0.76rem; color: #8d96ab; text-align: center; margin-bottom: 10px; line-height: 1.4; }

  .net-legend { display: flex; justify-content: center; gap: 16px; margin-top: 10px; font-size: 0.68rem; color: #8d96ab; flex-wrap: wrap; }
  .net-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .net-legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .node-modal-box { max-width: 420px; }

  .node-modal-check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }

  #subnet-canvas { display: block; width: 100%; margin-top: 12px; background: #0b0f1a; border-radius: 8px; }

  .node-modal-linkbtn { font-size: 0.75rem; color: var(--serie-badge); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; }
</style>

  let checked = {};

  // ---------- Utilidades de series/episodios ----------
  function episodeDoneCount(itemId, item) {
    if (!item.episodes) return 0;
    return item.episodes.filter(ep => episodeChecked[itemId] && episodeChecked[itemId][ep.id]).length;
  }

  function syncSeriesChecked(itemId) {
    const item = itemsById[itemId];
    if (!item || !item.episodes) return;
    const done = episodeDoneCount(itemId, item);
    checked[itemId] = done === item.episodes.length && item.episodes.length > 0;
  }

  function computeSeriesRating(itemId, item) {
    if (!item.episodes) return 0;
    const vals = item.episodes
      .map(ep => (episodeRatings[itemId] && episodeRatings[itemId][ep.id]) || 0)
      .filter(v => v > 0);
    if (vals.length === 0) return 0;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return Math.round(avg * 2) / 2;
  }

  function getRatingValue(scope, itemId, epId) {
    if (scope === 'movie') return ratings[itemId] || 0;
    if (scope === 'series') return computeSeriesRating(itemId, itemsById[itemId]);
    return (episodeRatings[itemId] && episodeRatings[itemId][epId]) || 0;
  }

  function setRatingValue(scope, itemId, epId, value) {
    if (scope === 'movie') {
      ratings[itemId] = ratings[itemId] === value ? 0 : value;
    } else if (scope === 'episode') {
      if (!episodeRatings[itemId]) episodeRatings[itemId] = {};
      episodeRatings[itemId][epId] = episodeRatings[itemId][epId] === value ? 0 : value;
    }
  }

  // ---------- Almacenamiento local + sincronización entre dispositivos ----------
  const PAYLOAD_VERSION = 4; // versión del formato guardado: permite migrar copias de seguridad antiguas al importarlas

  let localUpdatedAt = 0;     // marca de tiempo (ms) del último cambio aplicado: decide qué copia es la más reciente
  let syncDoc = null;         // documento privado de la persona en la base de datos del artefacto
  let syncStatus = 'local';   // 'local' | 'synced' | 'error'
  let syncWritable = true;
  let syncReconciled = false; // ya se comparó una vez con la copia remota definitiva
  let syncWriting = false;
  let syncPending = false;
  let syncWriteTimer = null;
  let syncLoadTimer = null;
  let syncRetries = 0;

  function migrateIdsShift(obj, threshold) {
    const out = {};
    Object.keys(obj || {}).forEach(k => {
      const n = parseInt(k, 10);
      const newKey = (!isNaN(n) && n >= threshold) ? String(n + 1) : k;
      out[newKey] = obj[k];
    });
    return out;
  }

  function applyPayload(parsed) {
    let c = parsed.checked || {};
    let r = parsed.ratings || {};
    let ec = parsed.episodeChecked || {};
    let er = parsed.episodeRatings || {};
    const v = parsed.v || 1;

    if (v < 2) { // copias antiguas: añade el hueco de Iron Man 3 (id 8)
      c = migrateIdsShift(c, 8); r = migrateIdsShift(r, 8);
      ec = migrateIdsShift(ec, 8); er = migrateIdsShift(er, 8);
    }
    if (v < 3) { // añade el hueco del Soldado de Invierno (id 10)
      c = migrateIdsShift(c, 10); r = migrateIdsShift(r, 10);
      ec = migrateIdsShift(ec, 10); er = migrateIdsShift(er, 10);
    }
    if (v < 4) { // añade el hueco de Eyes of Wakanda al principio (id 1): todo se desplaza +1
      c = migrateIdsShift(c, 1); r = migrateIdsShift(r, 1);
      ec = migrateIdsShift(ec, 1); er = migrateIdsShift(er, 1);
    }

    checked = c; ratings = r; episodeChecked = ec; episodeRatings = er;
    localUpdatedAt = Number(parsed.updatedAt) || 0;
  }

  function buildPayload() {
    return { v: PAYLOAD_VERSION, updatedAt: localUpdatedAt, checked, ratings, episodeChecked, episodeRatings };
  }

  function hasLocalProgress() {
    const nonEmpty = (o) => Object.keys(o || {}).some(k => {
      const v = o[k];
      return v && (typeof v !== 'object' || Object.keys(v).some(x => v[x]));
    });
    return nonEmpty(checked) || nonEmpty(ratings) || nonEmpty(episodeChecked) || nonEmpty(episodeRatings);
  }

  function localStorageOk() {
    try {
      const k = '__ucm_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  function writeLocal() {
    if (!storageAvailable) { lastSaveOk = false; return false; }
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(buildPayload()));
      lastSaveOk = true;
    } catch (e) {
      lastSaveOk = false;
    }
    return lastSaveOk;
  }

  function backupLocalCopy() { // seguro de vida antes de sustituir el progreso local por el remoto
    if (!storageAvailable || !hasLocalProgress()) return;
    try { window.localStorage.setItem(STORAGE_KEY + '-backup', JSON.stringify(buildPayload())); } catch (e) { /* sin espacio o bloqueado */ }
  }

  function loadProgress() {
    if (storageAvailable) {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) applyPayload(JSON.parse(raw));
      } catch (e) {
        // datos ilegibles o inexistentes: se empieza desde cero
      }
    }
    data.forEach(section => section.items.forEach(it => { if (it.serie) syncSeriesChecked(it.id); }));
  }

  function saveProgress() {
    // monótono: aunque el reloj de este dispositivo vaya atrasado, un cambio nuevo siempre supera al último conocido
    localUpdatedAt = Math.max(Date.now(), localUpdatedAt + 1);
    writeLocal();
    scheduleRemotePush();
    renderStatusBar();
    return lastSaveOk;
  }

  // --- Sincronización (capacidades «db» + «user»: espacio privado de cada persona, también frente al propietario) ---
  function scheduleRemotePush() {
    if (!syncDoc || !syncWritable) return;
    clearTimeout(syncWriteTimer);
    syncWriteTimer = setTimeout(pushRemote, 500); // agrupa ráfagas de cambios en una sola escritura
  }

  async function pushRemote() {
    if (!syncDoc || !syncWritable) return;
    if (syncWriting) { syncPending = true; return; }
    syncWriting = true;
    try {
      await syncDoc.set(JSON.parse(JSON.stringify(buildPayload())));
      syncStatus = 'synced';
      syncRetries = 0;
    } catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' || code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
        syncWritable = false; // esta persona no puede escribir aquí (p. ej. visitante): se queda en modo local
        syncStatus = 'local';
      } else {
        syncStatus = 'error';
        if (syncRetries < 3) { syncRetries++; setTimeout(scheduleRemotePush, 3000 + Math.random() * 3000); }
      }
    }
    syncWriting = false;
    if (syncPending) { syncPending = false; scheduleRemotePush(); }
    renderStatusBar();
  }

  function adoptRemote(remote) {
    try {
      const clean = JSON.parse(JSON.stringify(remote)); // las instantáneas llegan congeladas
      backupLocalCopy();
      applyPayload(clean);
      data.forEach(section => section.items.forEach(it => { if (it.serie) syncSeriesChecked(it.id); }));
      writeLocal();
      render();
    } catch (e) { /* copia remota ilegible: se ignora */ }
  }

  function onRemoteSnapshot(snap) {
    const definitive = !snap.metadata.fromCache;
    if (definitive) clearTimeout(syncLoadTimer);
    if (snap.metadata.hasPendingWrites) return; // eco de nuestra propia escritura

    if (!snap.exists) {
      if (definitive && !syncReconciled) {
        syncReconciled = true;
        syncStatus = 'synced';
        if (hasLocalProgress()) {
          if (!localUpdatedAt) { localUpdatedAt = Date.now(); writeLocal(); }
          scheduleRemotePush(); // primera subida de lo que ya había en este dispositivo
        }
        renderStatusBar();
      }
      return;
    }

    const remote = snap.data() || {};
    const rt = Number(remote.updatedAt) || 0;
    if (rt > localUpdatedAt) {
      adoptRemote(remote); // otro dispositivo guardó algo más reciente
    } else if (definitive && !syncReconciled && rt < localUpdatedAt) {
      scheduleRemotePush(); // lo de este dispositivo es más reciente que lo guardado
    }
    if (definitive) {
      syncReconciled = true;
      syncStatus = 'synced';
      renderStatusBar();
    }
  }

  function onRemoteError(e) {
    clearTimeout(syncLoadTimer);
    const code = e && e.code;
    if (code === 'revoked' || code === 'invalid_argument') { syncWritable = false; syncStatus = 'local'; }
    else { syncStatus = 'error'; }
    renderStatusBar();
  }

  async function initSync() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const results = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = results[0], user = results[1];
      if (!db || !user) return; // sin sesión, sin capacidad o visitante: solo guardado local
      const uid = await user.id();
      if (!uid) return;
      syncDoc = db.doc('data/users/' + uid + '/progress');
      syncLoadTimer = setTimeout(() => {
        if (!syncReconciled) { syncStatus = 'error'; renderStatusBar(); }
      }, 10000);
      syncDoc.onSnapshot(onRemoteSnapshot, onRemoteError);
    } catch (e) {
      syncDoc = null;
    }
  }

  function getCountdownParts() {
    const now = new Date();
    if (now >= DOOMSDAY_DATE) return null;
    let months = (DOOMSDAY_DATE.getFullYear() - now.getFullYear()) * 12 + (DOOMSDAY_DATE.getMonth() - now.getMonth());
    let anchor = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    if (anchor > DOOMSDAY_DATE) {
      months--;
      anchor = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    }
    let diffMs = DOOMSDAY_DATE - anchor;
    const days = Math.floor(diffMs / 86400000); diffMs -= days * 86400000;
    const hours = Math.floor(diffMs / 3600000); diffMs -= hours * 3600000;
    const minutes = Math.floor(diffMs / 60000); diffMs -= minutes * 60000;
    const seconds = Math.floor(diffMs / 1000);
    return { months, days, hours, minutes, seconds };
  }

  function starSVG(fillPct) {

  function fillPctFor(value, starIndex) {
    return Math.max(0, Math.min(100, (value - (starIndex - 1)) * 100));

  function renderStars(value) {
    let html = '';
    for (let i = 1; i <= 5; i++) {

          <span class="star-hit star-hit-right" data-value="${i}"></span>
        </span>
      `;
    }
    return html;
  }
  function ratingLabel(value) {
    return value > 0 ? value.toFixed(1).replace('.0', '') + ' / 5' : 'Sin valorar';
  }
  function setStarsVisual(starsEl, value) {
    starsEl.querySelectorAll('.star').forEach((starEl, idx) => {
      const i = idx + 1;
      starEl.querySelector('.star-fill-wrap').style.width = fillPctFor(value, i) + '%';
    });
  }

  function renderRatingRow(scope, itemId, epId, value, interactive) {
    const attrs = `data-scope="${scope}" data-item="${itemId}"` + (epId != null ? ` data-ep="${epId}"` : '');
    const clearAttrs = `data-clear-scope="${scope}" data-clear-item="${itemId}"` + (epId != null ? ` data-clear-ep="${epId}"` : '');
    return `
      <div class="rating-row ${interactive ? '' : 'readonly'}" ${attrs}>
        <span class="stars">${renderStars(value)}</span>
        <span class="rating-value">${ratingLabel(value)}</span>
        ${interactive && value > 0 ? `<span class="rating-clear" ${clearAttrs}>quitar</span>` : ''}
      </div>
    `;
  }

  function renderItem(item) {
    const isSeries = !!item.serie;
    let stateClass = '';
    if (isSeries) {
      const total = (item.episodes || []).length;
      const done = episodeDoneCount(item.id, item);
      stateClass = (total > 0 && done === total) ? 'done' : (done > 0 ? 'in-progress' : '');
    } else {
      stateClass = checked[item.id] ? 'done' : '';
    }

    let checkboxHtml;
    if (!isSeries) {
      checkboxHtml = `<div class="checkbox" data-action="toggle" data-id="${item.id}">${checkIcon()}</div>`;
    } else {
      const icon = stateClass === 'done' ? checkIcon() : (stateClass === 'in-progress' ? clockIcon() : '');
      checkboxHtml = `<div class="checkbox">${icon}</div>`;
    }

    let progressHtml = '';
    if (isSeries) {
      const total = (item.episodes || []).length;
      const done = episodeDoneCount(item.id, item);
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      progressHtml = `
        <div class="series-progress">
          <span class="series-progress-label">${pct}% completado</span>
          <div class="series-progress-bar"><div class="series-progress-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }

    let ratingSectionHtml;
    if (isSeries) {
      ratingSectionHtml = renderRatingRow('series', item.id, null, computeSeriesRating(item.id, item), false);
    } else {
      ratingSectionHtml = renderRatingRow('movie', item.id, null, ratings[item.id] || 0, true);
    }

    let episodesHtml = '';
    if (isSeries) {
      const isExpanded = !!expandedState[item.id];
      const rows = (item.episodes || []).map((ep, idx) => {
        const epDone = !!(episodeChecked[item.id] && episodeChecked[item.id][ep.id]);
        const epVal = (episodeRatings[item.id] && episodeRatings[item.id][ep.id]) || 0;
        return `
          <div class="episode-row">
            <div class="checkbox ep-checkbox ${epDone ? 'done' : ''}" data-action="toggle-episode" data-item="${item.id}" data-ep="${ep.id}">${checkIcon()}</div>
            <div class="episode-body">
              <div class="episode-title">${idx + 1}.- ${ep.title}</div>
              ${renderRatingRow('episode', item.id, ep.id, epVal, true)}
            </div>
          </div>
        `;
      }).join('');
      episodesHtml = `<div class="episode-list" style="display:${isExpanded ? 'flex' : 'none'}">${rows}</div>`;
    }

    const expandHint = isSeries ? `<div class="expand-hint">${expandedState[item.id] ? '▾ Toca para contraer episodios' : '▸ Toca para ver episodios'}</div>` : '';

    return `
      <div class="item ${stateClass}" data-id="${item.id}" ${isSeries ? 'data-expandable="1"' : ''}>
        ${checkboxHtml}
        <div class="item-body">
          <div class="item-title-row">
            <span class="item-num">${item.id}.</span>
            <span class="item-title">${item.title}</span>
            ${item.serie ? '<span class="badge-serie">SERIE</span>' : ''}
            ${progressHtml}
          </div>
          <div class="item-desc">${item.desc}</div>
          ${ratingSectionHtml}
          ${expandHint}
          ${episodesHtml}
        </div>
      </div>
    `;
  }

  // ---------- Red Neuronal dinámica (canvas) ----------
  let flatItemsCache = null;
  function getFlatItems() {
    if (!flatItemsCache) {
      flatItemsCache = [];
      data.forEach(section => section.items.forEach(it => flatItemsCache.push(it)));
    }
    return flatItemsCache;
  }

  // --- Red principal ---
  let netCanvas, netCtx, netAnimId = null, netMouse = { x: -9999, y: -9999 };
  let netNodesLayout = []; // { item, bx, by, phase, speed }
  let netHeight = 600;
  let lastNetWidth = 0;

  function seededRand(seed) {
    const x = Math.sin(seed * 999.77) * 10000;
    return x - Math.floor(x);
  }

  function layoutMainNetwork(width) {
    const items = getFlatItems();
    const marginX = 46, marginY = 40, rowGap = 68;
    const cols = Math.max(4, Math.min(9, Math.floor((width - marginX * 2) / 82)));
    const usableW = width - marginX * 2;
    const colSpacing = cols > 1 ? usableW / (cols - 1) : usableW;
    netNodesLayout = items.map((item, i) => {
      const row = Math.floor(i / cols);
      let col = i % cols;
      if (row % 2 === 1) col = cols - 1 - col;
      const jitterX = (seededRand(item.id) - 0.5) * colSpacing * 0.35;
      const jitterY = (seededRand(item.id + 0.37) - 0.5) * rowGap * 0.35;
      const x = (cols > 1 ? marginX + col * colSpacing : width / 2) + jitterX;
      const y = marginY + row * rowGap + jitterY;
      return { item, bx: x, by: y, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.4 };
    });
    const rows = Math.ceil(items.length / cols);
    netHeight = marginY * 2 + rows * rowGap;
  }

  function drawStub(ctx, x, y, angle, len, colorFrom, colorTo) {
    const x2 = x + Math.cos(angle) * len;
    const y2 = y + Math.sin(angle) * len;
    const grad = ctx.createLinearGradient(x, y, x2, y2);
    grad.addColorStop(0, colorFrom);
    grad.addColorStop(1, colorTo);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawStubFan(ctx, x, y, baseAngle, spread, count, len, colorFrom, colorTo) {
    if (count <= 0) return;
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0 : (i / (count - 1)) - 0.5; // -0.5..0.5
      const angle = baseAngle + t * spread;
      drawStub(ctx, x, y, angle, len, colorFrom, colorTo);
    }
  }

  function animateMainNetwork(ts) {
    if (!netCanvas || currentView !== 'network') { netAnimId = null; return; }
    const dpr = window.devicePixelRatio || 1;
    const w = netCanvas.width / dpr;
    const h = netCanvas.height / dpr;
    netCtx.clearRect(0, 0, w, h);
    const t = ts / 1000;

    // posiciones animadas (flotación idle + repulsión de ratón), limitadas al lienzo
    const NODE_PAD = 26; // espacio reservado para el radio, el brillo y las ramificaciones
    const positions = netNodesLayout.map(n => {
      let x = n.bx + Math.sin(t * n.speed + n.phase) * 4 * IDLE_AMP;
      let y = n.by + Math.cos(t * n.speed * 0.8 + n.phase) * 4 * IDLE_AMP;
      const dx = x - netMouse.x, dy = y - netMouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const influence = Math.max(0, 1 - dist / 90);
      if (influence > 0) {
        x += (dx / (dist || 1)) * influence * 14;
        y += (dy / (dist || 1)) * influence * 14;
      }
      x = Math.max(NODE_PAD, Math.min(w - NODE_PAD, x));
      y = Math.max(NODE_PAD, Math.min(h - NODE_PAD, y));
      return { x, y, influence, item: n.item };
    });

    // detectar el nodo más cercano al cursor (para mostrar su etiqueta)
    let hoveredIdx = -1, hoveredDist = 22;
    positions.forEach((p, i) => {
      const d = Math.sqrt((p.x - netMouse.x) ** 2 + (p.y - netMouse.y) ** 2);
      if (d < hoveredDist) { hoveredDist = d; hoveredIdx = i; }
    });

    // conexiones principales de la línea temporal
    for (let i = 1; i < positions.length; i++) {
      const a = positions[i - 1], b = positions[i];
      const bDone = !!checked[b.item.id];
      netCtx.strokeStyle = bDone ? '#22c55e' : 'rgba(255,255,255,0.35)';
      netCtx.lineWidth = bDone ? 2 : 1;
      netCtx.beginPath();
      netCtx.moveTo(a.x, a.y);
      netCtx.lineTo(b.x, b.y);
      netCtx.stroke();
    }

    // ramificaciones independientes de contenido secundario (una por título relacionado)
    positions.forEach(p => {
      const sec = secondaryMap[p.item.id];
      if (!sec) return;
      const before = sec.before || [];
      const after = sec.after || [];
      drawStubFan(netCtx, p.x, p.y, Math.PI * 1.25, Math.PI * 0.55, before.length, 18, '#22c55e', '#3b82c4');
      drawStubFan(netCtx, p.x, p.y, Math.PI * -0.25, Math.PI * 0.55, after.length, 18, '#22c55e', '#eab308');
    });

    // nodos
    positions.forEach(p => {
      const done = !!checked[p.item.id];
      const r = 6 + p.influence * 4;
      const color = done ? '#22c55e' : '#ffffff';
      netCtx.save();
      netCtx.shadowColor = color;
      netCtx.shadowBlur = 6 + p.influence * 14;
      netCtx.fillStyle = color;
      netCtx.beginPath();
      netCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
      netCtx.fill();
      netCtx.restore();
    });

    // etiqueta: solo el título bajo el cursor, encima del punto (o debajo si no cabe arriba)
    if (hoveredIdx >= 0) {
      const p = positions[hoveredIdx];
      const r = 6 + p.influence * 4;
      netCtx.font = '600 11px -apple-system, sans-serif';
      const textW = netCtx.measureText(p.item.title).width;
      const boxW = textW + 10;

      let textX = p.x;
      const half = boxW / 2;
      if (textX - half < 4) textX = half + 4;
      if (textX + half > w - 4) textX = w - 4 - half;

      let boxY = p.y - r - 24;
      let textY = p.y - r - 12;
      if (boxY < 2) { boxY = p.y + r + 8; textY = p.y + r + 20; }

      netCtx.textAlign = 'center';
      netCtx.fillStyle = 'rgba(0,0,0,0.75)';
      netCtx.fillRect(textX - half, boxY, boxW, 16);
      netCtx.fillStyle = '#e8ecf5';
      netCtx.fillText(p.item.title, textX, textY);
    }

    netLastPositions = positions;
    netAnimId = requestAnimationFrame(animateMainNetwork);
  }

  let netLastPositions = [];

  function initMainNetworkCanvas() {
    netCanvas = document.getElementById('net-canvas');
    if (!netCanvas) return;
    netCtx = netCanvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const width = netCanvas.clientWidth || 320;
    lastNetWidth = width;
    layoutMainNetwork(width);
    netCanvas.width = width * dpr;
    netCanvas.height = netHeight * dpr;
    netCanvas.style.height = netHeight + 'px';
    netCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    netCanvas.addEventListener('mousemove', (e) => {
      const rect = netCanvas.getBoundingClientRect();
      netMouse.x = e.clientX - rect.left;
      netMouse.y = e.clientY - rect.top;
    });
    netCanvas.addEventListener('mouseleave', () => { netMouse.x = -9999; netMouse.y = -9999; });
    netCanvas.addEventListener('touchstart', (e) => {
      const rect = netCanvas.getBoundingClientRect();
      const touch = e.touches[0];
      netMouse.x = touch.clientX - rect.left;
      netMouse.y = touch.clientY - rect.top;
    }, { passive: true });
    netCanvas.addEventListener('touchend', () => {
      setTimeout(() => { netMouse.x = -9999; netMouse.y = -9999; }, 1200);
    });
    netCanvas.addEventListener('touchmove', (e) => {
      const rect = netCanvas.getBoundingClientRect();
      const touch = e.touches[0];
      netMouse.x = touch.clientX - rect.left;
      netMouse.y = touch.clientY - rect.top;
    }, { passive: true });

    netCanvas.addEventListener('click', (e) => {
      const rect = netCanvas.getBoundingClientRect();
      const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
      let closest = null, closestDist = 26;
      netLastPositions.forEach(p => {
        const d = Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2);
        if (d < closestDist) { closestDist = d; closest = p; }
      });
      if (closest) openNetworkNodeModal(closest.item.id);
    });

    if (netAnimId) cancelAnimationFrame(netAnimId);
    netAnimId = requestAnimationFrame(animateMainNetwork);
  }

  function stopMainNetworkCanvas() {
    if (netAnimId) { cancelAnimationFrame(netAnimId); netAnimId = null; }
  }

  // --- Sub-red (dentro de la ventana flotante) ---
  let subCanvas, subCtx, subAnimId = null, subMouse = { x: -9999, y: -9999 };
  let subNodesLayout = [];
  let subLastPositions = [];

  function wrapCanvasText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    words.forEach(word => {
      const test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  function layoutSubNetwork(ctx, before, after, width, height, rowH, maxLabelWidth) {
    const cx = width / 2, cy = height / 2;
    subNodesLayout = [];
    const margin = Math.max(34, maxLabelWidth / 2 + 14);
    ctx.font = '10px -apple-system, sans-serif';
    before.forEach((title, i) => {
      subNodesLayout.push({ title, lines: wrapCanvasText(ctx, title, maxLabelWidth), group: 'before', bx: margin, by: rowH * (i + 1), phase: Math.random() * Math.PI * 2 });
    });
    after.forEach((title, i) => {
      subNodesLayout.push({ title, lines: wrapCanvasText(ctx, title, maxLabelWidth), group: 'after', bx: width - margin, by: rowH * (i + 1), phase: Math.random() * Math.PI * 2 });
    });
    return { cx, cy };
  }

  function animateSubNetwork(ts, cx, cy) {
    if (!subCanvas) { subAnimId = null; return; }
    const dpr = window.devicePixelRatio || 1;
    const w = subCanvas.width / dpr, h = subCanvas.height / dpr;
    subCtx.clearRect(0, 0, w, h);
    const t = ts / 1000;

    const SUB_PAD = 30;
    const positions = subNodesLayout.map(n => {
      let x = n.bx + Math.sin(t * 0.6 + n.phase) * 3 * IDLE_AMP;
      let y = n.by + Math.cos(t * 0.5 + n.phase) * 3 * IDLE_AMP;
      const dx = x - subMouse.x, dy = y - subMouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const influence = Math.max(0, 1 - dist / 70);
      if (influence > 0) {
        x += (dx / (dist || 1)) * influence * 8;
        y += (dy / (dist || 1)) * influence * 8;
      }
      x = Math.max(SUB_PAD, Math.min(w - SUB_PAD, x));
      y = Math.max(SUB_PAD, Math.min(h - SUB_PAD, y));
      return { ...n, x, y, influence };
    });

    positions.forEach(p => {
      const grad = subCtx.createLinearGradient(p.x, p.y, cx, cy);
      if (p.group === 'before') { grad.addColorStop(0, '#3b82c4'); grad.addColorStop(1, '#22c55e'); }
      else { grad.addColorStop(0, '#22c55e'); grad.addColorStop(1, '#eab308'); }
      subCtx.strokeStyle = grad;
      subCtx.lineWidth = 1.6;
      subCtx.globalAlpha = 0.8;
      subCtx.beginPath();
      subCtx.moveTo(p.group === 'before' ? p.x : cx, p.group === 'before' ? p.y : cy);
      subCtx.lineTo(p.group === 'before' ? cx : p.x, p.group === 'before' ? cy : p.y);
      subCtx.stroke();
      subCtx.globalAlpha = 1;
    });

    // hub central
    subCtx.save();
    subCtx.shadowColor = '#22c55e';
    subCtx.shadowBlur = 12;
    subCtx.fillStyle = '#22c55e';
    subCtx.beginPath();
    subCtx.arc(cx, cy, 8, 0, Math.PI * 2);
    subCtx.fill();
    subCtx.restore();

    subCtx.font = '10px -apple-system, sans-serif';
    subCtx.textAlign = 'center';

    positions.forEach(p => {
      const color = p.group === 'before' ? '#3b82c4' : '#eab308';
      const r = 5 + p.influence * 3;
      subCtx.save();
      subCtx.shadowColor = color;
      subCtx.shadowBlur = 4 + p.influence * 10;
      subCtx.fillStyle = color;
      subCtx.beginPath();
      subCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
      subCtx.fill();
      subCtx.restore();

      const lines = p.lines && p.lines.length ? p.lines : [p.title];
      const lineH = 12;
      const blockH = lines.length * lineH;
      let startY = p.y - r - 8 - (blockH - lineH);

      subCtx.fillStyle = '#e8ecf5';
      lines.forEach((line, li) => {
        const tw = subCtx.measureText(line).width;
        let tx = p.x;
        if (tx - tw / 2 < 3) tx = tw / 2 + 3;
        if (tx + tw / 2 > w - 3) tx = w - 3 - tw / 2;
        subCtx.fillText(line, tx, startY + li * lineH);
      });
    });

    subLastPositions = positions;
    subAnimId = requestAnimationFrame((ts2) => animateSubNetwork(ts2, cx, cy));
  }

  function initSubNetworkCanvas(before, after) {
    subCanvas = document.getElementById('subnet-canvas');
    if (!subCanvas) return;
    subCtx = subCanvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const width = subCanvas.clientWidth || 360;
    const maxLabelWidth = Math.min(150, width * 0.4);

    // medir cuántas líneas necesita el texto más largo para reservar altura de sobra
    subCtx.font = '10px -apple-system, sans-serif';
    const allTexts = [...before, ...after];
    const maxLines = allTexts.length
      ? Math.max(1, ...allTexts.map(t => wrapCanvasText(subCtx, t, maxLabelWidth).length))
      : 1;

    const rows = Math.max(before.length, after.length, 1);
    const baseRowH = 46;
    const rowH = baseRowH + (maxLines - 1) * 13;
    const height = Math.max(150, rows * rowH + 40);

    subCanvas.width = width * dpr;
    subCanvas.height = height * dpr;
    subCanvas.style.height = height + 'px';
    subCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { cx, cy } = layoutSubNetwork(subCtx, before, after, width, height, rowH, maxLabelWidth);

    subCanvas.addEventListener('mousemove', (e) => {
      const rect = subCanvas.getBoundingClientRect();
      subMouse.x = e.clientX - rect.left;
      subMouse.y = e.clientY - rect.top;
    });
    subCanvas.addEventListener('mouseleave', () => { subMouse.x = -9999; subMouse.y = -9999; });

    if (subAnimId) cancelAnimationFrame(subAnimId);
    subAnimId = requestAnimationFrame((ts) => animateSubNetwork(ts, cx, cy));
  }

  function stopSubNetworkCanvas() {
    if (subAnimId) { cancelAnimationFrame(subAnimId); subAnimId = null; }
  }

  // --- Ventana flotante de detalle de nodo ---
  function openNetworkNodeModal(itemId) {
    const item = itemsById[itemId];
    if (!item) return;
    const sec = secondaryMap[itemId] || {};
    const before = sec.before || [];
    const after = sec.after || [];
    const hasSecondary = before.length + after.length > 0;

    let bodyHtml = `
      <div class="modal-title">${item.id}. ${item.title}${item.serie ? ' <span class="badge-serie">SERIE</span>' : ''}</div>
      <div class="node-modal-desc">${item.desc}</div>
    `;

    if (!item.serie) {
      const val = ratings[item.id] || 0;
      const isDone = !!checked[item.id];
      bodyHtml += `
        <div class="node-modal-check-row">
          <div class="checkbox ${isDone ? 'done' : ''}" id="node-modal-check" style="cursor:pointer;">${checkIcon()}</div>
          <span style="font-size:0.85rem;">${isDone ? 'Vista' : 'Marcar como vista'}</span>
        </div>
        ${renderRatingRow('movie', item.id, null, val, true)}
      `;
    } else {
      const total = (item.episodes || []).length;
      const doneCount = episodeDoneCount(item.id, item);
      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      const seriesVal = computeSeriesRating(item.id, item);
      bodyHtml += `
        <div class="node-modal-progress">${pct}% completado (${doneCount}/${total} episodios)</div>
        ${renderRatingRow('series', item.id, null, seriesVal, false)}
        <button class="node-modal-linkbtn" id="node-modal-goto-checklist">Marcar episodios en el Checklist →</button>
      `;
    }

    bodyHtml += hasSecondary
      ? `<canvas id="subnet-canvas"></canvas>`
      : `<div class="subnet-empty">Sin contenido secundario relacionado directamente.</div>`;

    bodyHtml += `<div class="modal-actions"><button class="btn" id="close-modal-btn">Cerrar</button></div>`;

    openModal(bodyHtml);
    document.getElementById('modal-box').classList.add('node-modal-box');

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      stopSubNetworkCanvas();
      closeModal();
    });

    if (!item.serie) {
      document.getElementById('node-modal-check').addEventListener('click', async () => {
        checked[item.id] = !checked[item.id];
        await saveProgress();
        openNetworkNodeModal(itemId); // refresca la ventana con el nuevo estado
      });
    } else {
      const linkBtn = document.getElementById('node-modal-goto-checklist');
      if (linkBtn) linkBtn.addEventListener('click', () => {
        stopSubNetworkCanvas();
        closeModal();
        currentView = 'checklist';
        expandedState[item.id] = true;
        render();
        const target = document.querySelector(`.item[data-id="${item.id}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.style.boxShadow = '0 0 0 3px var(--gold)';
          target.style.transition = 'box-shadow 0.6s ease';
          setTimeout(() => { target.style.boxShadow = ''; }, 1800);
        }
      });
    }

    // valoración (reutiliza el sistema de estrellas ya existente)
    document.querySelectorAll('.modal-box .rating-row').forEach(row => {
      if (row.classList.contains('readonly')) return;
      const scope = row.getAttribute('data-scope');
      const rowItemId = row.getAttribute('data-item');
      const starsEl = row.querySelector('.stars');
      const valueEl = row.querySelector('.rating-value');
      const actualValue = getRatingValue(scope, rowItemId, null);
      starsEl.querySelectorAll('.star-hit').forEach(hit => {
        hit.addEventListener('mousemove', (e) => {
          e.stopPropagation();
          const v = parseFloat(hit.getAttribute('data-value'));
          setStarsVisual(starsEl, v);
          valueEl.textContent = ratingLabel(v);
          valueEl.classList.add('previewing');
        });
        hit.addEventListener('click', async (e) => {
          e.stopPropagation();
          const v = parseFloat(hit.getAttribute('data-value'));
          setRatingValue(scope, rowItemId, null, v);
          await saveProgress();
          openNetworkNodeModal(itemId);
        });
      });
      starsEl.addEventListener('mouseleave', () => {
        setStarsVisual(starsEl, actualValue);
        valueEl.textContent = ratingLabel(actualValue);
        valueEl.classList.remove('previewing');
      });
    });

    if (hasSecondary) initSubNetworkCanvas(before, after);
  }

  function renderNetworkView() {
    return `
      <div class="network-wrap">
        <div class="network-intro">Mueve el cursor (o desliza el dedo) sobre la red para explorarla. Toca un punto para ver su ficha completa.<br>Blanco = pendiente · Verde = visto. Las ramas indican contenido antes (azul) / después (amarillo).</div>
        <canvas id="net-canvas" role="img" aria-label="Mapa animado de los títulos del UCM en orden cronológico. La pestaña Checklist ofrece la misma información en forma de lista."></canvas>
        <div class="net-legend">
          <span><span class="net-legend-dot" style="background:#fff"></span> Pendiente</span>
          <span><span class="net-legend-dot" style="background:#22c55e"></span> Visto</span>
          <span><span class="net-legend-dot" style="background:#3b82c4"></span> Contenido antes</span>
          <span><span class="net-legend-dot" style="background:#eab308"></span> Contenido después</span>
        </div>
      </div>
    `;
  }

  function wireTabListeners() {
    const tabChecklist = document.getElementById('tab-checklist');
    const tabNetwork = document.getElementById('tab-network');
    if (tabChecklist) tabChecklist.addEventListener('click', () => {
      stopMainNetworkCanvas();
      currentView = 'checklist';
      render();
    });
    if (tabNetwork) tabNetwork.addEventListener('click', () => {
      currentView = 'network';
      render();
    });
  }

  function render() {
    const doneCount = Object.values(checked).filter(Boolean).length;
    const pct = totalItems ? Math.round((doneCount / totalItems) * 100) : 0;

    let html = `
      <div class="header">
        <h1>🎬 Maratón UCM: Camino a Doomsday</h1>
        <div class="subtitle">${totalItems} títulos esenciales en orden cronológico</div>
      </div>
      <div class="status-bar" id="status-bar">
        <span class="status-text"></span>
        <span class="status-actions">
          <button class="mini-btn" id="export-btn-top">Exportar</button>
          <button class="mini-btn" id="import-btn-top">Importar</button>
        </span>
      </div>
      <div class="tab-bar">
        <button class="tab-btn ${currentView === 'checklist' ? 'active' : ''}" id="tab-checklist">📋 Checklist</button>
        <button class="tab-btn ${currentView === 'network' ? 'active' : ''}" id="tab-network">🕸️ Red Neuronal</button>
      </div>
    `;

    if (currentView === 'network') {
      html += renderNetworkView() + legalNote();
      document.getElementById('app').innerHTML = html;
      renderStatusBar();
      wireTabListeners();
      wireStatusBarButtons();
      initMainNetworkCanvas();
      return;
    }

    html += `
      ${renderCountdown()}
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${doneCount} / ${totalItems} vistos (${pct}%)</div>
      </div>
    `;

    data.forEach(section => {
      html += `<div class="saga-title">${section.saga}</div>`;
      section.items.forEach(item => { html += renderItem(item); });
    });

    html += `
      <div class="doomsday-card">
        <div class="title">🔥 Avengers: Doomsday</div>
        <div class="date">18 de diciembre de 2026 (17 dic en Latinoamérica)</div>
      </div>
      <div class="footer-controls">
        <button class="btn" id="export-btn">Exportar progreso</button>
        <button class="btn" id="import-btn">Importar progreso</button>
        <button class="btn" id="reset-btn">Reiniciar todo</button>
      </div>
      ${legalNote()}
    `;

    document.getElementById('app').innerHTML = html;
    renderStatusBar();
    wireTabListeners();

    // Expandir/contraer series al pulsar la caja general
    document.querySelectorAll('[data-expandable="1"]').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-id');
        expandedState[id] = !expandedState[id];
        render();
      });
    });

    // Checkbox de películas
    document.querySelectorAll('[data-action="toggle"]').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-id');
        checked[id] = !checked[id];
        await saveProgress();
        render();
        maybeNudgeExport();
      });
    });

    // Checkbox de episodios
    document.querySelectorAll('[data-action="toggle-episode"]').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const itemId = el.getAttribute('data-item');
        const epId = el.getAttribute('data-ep');
        if (!episodeChecked[itemId]) episodeChecked[itemId] = {};
        episodeChecked[itemId][epId] = !episodeChecked[itemId][epId];
        syncSeriesChecked(itemId);
        await saveProgress();
        render();
        maybeNudgeExport();
      });
    });

    // Valoraciones (películas y episodios; series es solo lectura)
    document.querySelectorAll('.rating-row').forEach(row => {
      if (row.classList.contains('readonly')) return;
      const scope = row.getAttribute('data-scope');
      const itemId = row.getAttribute('data-item');
      const epId = row.getAttribute('data-ep');
      const starsEl = row.querySelector('.stars');
      const valueEl = row.querySelector('.rating-value');
      const actualValue = getRatingValue(scope, itemId, epId);

      starsEl.querySelectorAll('.star-hit').forEach(hit => {
        hit.addEventListener('mousemove', (e) => {
          e.stopPropagation();
          const v = parseFloat(hit.getAttribute('data-value'));
          setStarsVisual(starsEl, v);
          valueEl.textContent = ratingLabel(v);
          valueEl.classList.add('previewing');
        });
        hit.addEventListener('click', async (e) => {
          e.stopPropagation();
          const v = parseFloat(hit.getAttribute('data-value'));
          setRatingValue(scope, itemId, epId, v);
          await saveProgress();
          render();
          maybeNudgeExport();
        });
      });
      starsEl.addEventListener('mouseleave', (e) => {
        e.stopPropagation();
        setStarsVisual(starsEl, actualValue);
        valueEl.textContent = ratingLabel(actualValue);
        valueEl.classList.remove('previewing');
      });
    });

    document.querySelectorAll('.rating-clear').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const scope = el.getAttribute('data-clear-scope');
        const itemId = el.getAttribute('data-clear-item');
        const epId = el.getAttribute('data-clear-ep');
        if (scope === 'movie') delete ratings[itemId];
        else if (scope === 'episode' && episodeRatings[itemId]) delete episodeRatings[itemId][epId];
        await saveProgress();
        render();
      });
    });

    document.getElementById('export-btn').addEventListener('click', openExportModal);
    document.getElementById('import-btn').addEventListener('click', openImportModal);
    document.getElementById('export-btn-top').addEventListener('click', openExportModal);
    document.getElementById('import-btn-top').addEventListener('click', openImportModal);
    document.getElementById('reset-btn').addEventListener('click', openResetModal);
  }

  function init() {
    storageAvailable = localStorageOk();
    loadProgress();
    render();
    initSync();

    setInterval(() => {
      const cd = document.querySelector('.countdown');
      if (cd) cd.outerHTML = renderCountdown();
    }, 1000);

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (currentView !== 'network') return;
        const c = document.getElementById('net-canvas');
        if (c && Math.abs(c.clientWidth - lastNetWidth) > 2) render();
      }, 200);
    });
  }

  try {
    init();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="loading">Ocurrió un error al iniciar. Recarga la página para intentarlo de nuevo.</div>';
  }
})();
</script>
</body>
</html>
